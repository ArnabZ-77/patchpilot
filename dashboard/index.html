<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PatchPilot</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121820; --panel2: #171f2a; --border: #253040;
    --text: #e6edf3; --muted: #8b98a5; --accent: #5fb3ff; --green: #3fb950;
    --yellow: #d29922; --red: #f85149; --purple: #a371f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  #stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  #stats .stat .v { color: #f0a500; font-size: 22px; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.live { color: var(--green); }
  .layout { display: grid; grid-template-columns: 340px 1fr; flex: 1; min-height: 0; }
  #list { border-right: 1px solid var(--border); overflow-y: auto; }
  .card { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .card:hover { background: var(--panel2); }
  .card.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .card .title { font-weight: 600; font-size: 13px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .empty { padding: 40px 20px; color: var(--muted); text-align: center; }
  #detail { overflow-y: auto; padding: 20px 28px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .badge.received, .badge.triage, .badge.reproduce, .badge.fix, .badge.validate, .badge.review, .badge.pr { background: #1f3a5f; color: var(--accent); }
  .badge.done { background: #113321; color: var(--green); }
  .badge.needs_human { background: #3d2f08; color: var(--yellow); }
  .badge.failed { background: #3a1414; color: var(--red); }
  .stagebar { display: flex; gap: 4px; margin: 16px 0 20px; }
  .stagebar .seg { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .stagebar .seg.on { background: var(--accent); }
  .stagebar .seg.done { background: var(--green); }
  .stagebar .seg.bad { background: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
  section { margin: 22px 0; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 0 0 8px; }
  .block { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
  .block.guard { border-color: #4a2a1a; background: #1a120a; }
  .block.guard .t { color: var(--red); font-weight: 600; font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 6px 0 0; color: #c9d1d9; }
  .timeline-item { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .timeline-item .ts { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .timeline-item .type { color: var(--purple); font-weight: 600; white-space: nowrap; }
  .pr-link { display: inline-block; margin-top: 8px; color: var(--accent); text-decoration: none; font-weight: 600; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>PatchPilot</h1>
  <span class="tag">production crash → tested PR</span>
  <span id="status">connecting…</span>
</header>
<div id="stats">
  <div class="stat"><div class="k">Median time to PR</div><div class="v" id="s-time">—</div></div>
  <div class="stat"><div class="k">Auto-fixed</div><div class="v" id="s-fixed">—</div></div>
  <div class="stat"><div class="k">Blocked actions</div><div class="v" id="s-blocks">—</div></div>
  <div class="stat"><div class="k">Cost per fix</div><div class="v" id="s-cost">—</div></div>
</div>
<div class="layout">
  <div id="list"><div class="empty">No incidents yet.<br/><code>npm run demo:crash</code> to send one.</div></div>
  <div id="detail"><div class="empty">Select an incident.</div></div>
</div>
<script>
const STAGES = ["received","triage","reproduce","fix","validate","review","pr","done"];
let incidents = new Map();
let selected = null;

async function loadAll() {
  const res = await fetch("/api/incidents");
  const list = await res.json();
  for (const inc of list) incidents.set(inc.id, inc);
  renderList();
  if (!selected && list.length) select(list[0].id);
}

// Headline numbers, recomputed from every incident on each update.
// "Auto-fixed" = PRs ready out of incidents that have finished (done, needs human, or failed).
function renderStats() {
  const all = [...incidents.values()];
  const finished = all.filter(i => ["done", "needs_human", "failed"].includes(i.stage));
  const done = all.filter(i => i.stage === "done");
  const times = done.map(i => i.durationMs).filter(t => typeof t === "number").sort((a, b) => a - b);
  const median = times.length ? times[Math.floor(times.length / 2)] : null;
  const blocks = all.reduce((n, i) => n + (i.guardrailBlocks?.length || 0), 0);
  const fixCost = done.reduce((s, i) => s + (i.usage?.inr || 0), 0);
  document.getElementById("s-time").textContent = median == null ? "—" : fmtDuration(median);
  document.getElementById("s-fixed").textContent = finished.length ? `${done.length} / ${finished.length}` : "—";
  document.getElementById("s-blocks").textContent = String(blocks);
  document.getElementById("s-cost").textContent = done.length ? `₹${(fixCost / done.length).toFixed(2)}` : "—";
}

function fmtDuration(ms) {
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
}

function renderList() {
  renderStats();
  const el = document.getElementById("list");
  const sorted = [...incidents.values()].sort((a, b) => (a.lastSeen < b.lastSeen ? 1 : -1));
  if (!sorted.length) { el.innerHTML = '<div class="empty">No incidents yet.</div>'; return; }
  el.innerHTML = sorted.map(inc => `
    <div class="card ${inc.id === selected ? "active" : ""}" data-id="${inc.id}">
      <div class="title">${escapeHtml(inc.title || inc.exceptionType)}</div>
      <div class="meta">
        <span class="badge ${inc.stage}">${inc.stage.replace("_"," ")}</span>
        <span>${inc.occurrences}× · ₹${(inc.usage?.inr ?? 0).toFixed(2)}</span>
      </div>
    </div>`).join("");
  el.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => select(c.dataset.id)));
}

async function select(id) {
  selected = id;
  renderList();
  const res = await fetch(`/api/incidents/${id}`);
  const inc = await res.json();
  incidents.set(id, inc);
  renderDetail(inc);
}

function renderDetail(inc) {
  const el = document.getElementById("detail");
  const stageIdx = STAGES.indexOf(inc.stage);
  const bad = inc.stage === "failed" || inc.stage === "needs_human";
  const bar = STAGES.map((s, i) => {
    let cls = "seg";
    if (bad && i <= (stageIdx === -1 ? STAGES.length : stageIdx)) cls += " bad";
    else if (inc.stage === "done" || i < stageIdx) cls += " done";
    else if (i === stageIdx) cls += " on";
    return `<div class="${cls}" title="${s}"></div>`;
  }).join("");

  const guardBlocks = (inc.guardrailBlocks || []).map(b => `
    <div class="block guard">
      <div class="t">⛔ blocked in ${b.stage}</div>
      <pre>${escapeHtml(b.reason)}</pre>
    </div>`).join("") || '<div class="muted">No unsafe actions attempted.</div>';

  const attempts = (inc.attempts || []).map(a => `
    <div class="block">
      <strong>Attempt ${a.attempt}</strong> — <span class="badge ${a.outcome === "accepted" ? "done" : a.outcome === "escalated" ? "needs_human" : "failed"}">${a.outcome}</span>
      ${a.hypothesis ? `<pre>${escapeHtml(a.hypothesis)}</pre>` : ""}
      ${a.rejectionReason ? `<pre>${escapeHtml(a.rejectionReason)}</pre>` : ""}
      ${a.hardChecks?.length ? `<div class="muted" style="margin-top:6px;font-size:11px;">${a.hardChecks.map(c => (c.ok ? "✅" : "❌") + " " + c.name).join(" &nbsp; ")}</div>` : ""}
    </div>`).join("") || '<div class="muted">No fix attempts yet.</div>';

  const timeline = (inc.timeline || []).slice().reverse().slice(0, 150).map(t => `
    <div class="timeline-item">
      <span class="ts">${new Date(t.ts).toLocaleTimeString()}</span>
      <span class="type">${t.type}</span>
      <span>${escapeHtml((t.text || "").slice(0, 300))}</span>
    </div>`).join("");

  const prSection = inc.pr ? `
    <section><h2>Pull request</h2>
      <div class="block">
        <strong>${escapeHtml(inc.pr.title)}</strong><br/>
        <span class="muted">branch ${inc.pr.branch} · commit ${(inc.pr.commit || "").slice(0,8)}</span>
        ${inc.pr.url ? `<br/><a class="pr-link" href="${inc.pr.url}" target="_blank">Open PR →</a>` : '<br/><span class="muted">gh PR creation skipped (set PATCHPILOT_OPEN_PR=1 + a GitHub remote to open one)</span>'}
        <pre>${escapeHtml(inc.pr.body || "")}</pre>
      </div>
    </section>` : "";

  const needsHuman = inc.needsHumanReason ? `<section><h2>Needs human</h2><div class="block guard"><pre>${escapeHtml(inc.needsHumanReason)}</pre></div></section>` : "";

  el.innerHTML = `
    <h2 style="font-size:20px;color:var(--text);text-transform:none;letter-spacing:0;margin-bottom:4px;">${escapeHtml(inc.title)}</h2>
    <span class="badge ${inc.stage}">${inc.stage.replace("_"," ")}</span>
    <span class="muted"> · ${inc.repo} · ${inc.occurrences} occurrence(s) · first seen ${new Date(inc.firstSeen).toLocaleString()}</span>
    <div class="stagebar">${bar}</div>
    <div class="grid">
      <div class="stat"><div class="k">Cost</div><div class="v">₹${(inc.usage?.inr ?? 0).toFixed(2)}</div></div>
      <div class="stat"><div class="k">Tokens</div><div class="v">${fmtNum((inc.usage?.inputTokens||0)+(inc.usage?.outputTokens||0))}</div></div>
      <div class="stat"><div class="k">Duration</div><div class="v">${inc.durationMs ? (inc.durationMs/1000).toFixed(1)+"s" : "…"}</div></div>
      <div class="stat"><div class="k">Blocked</div><div class="v">${(inc.guardrailBlocks||[]).length}</div></div>
    </div>
    ${needsHuman}
    ${prSection}
    <section><h2>Fix attempts</h2>${attempts}</section>
    <section><h2>Guardrail blocks</h2>${guardBlocks}</section>
    <section><h2>Timeline</h2>${timeline || '<div class="muted">…</div>'}</section>
  `;
}

function fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(1) + "k" : String(n); }
function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function connectStream() {
  const es = new EventSource("/api/stream");
  const statusEl = document.getElementById("status");
  es.addEventListener("ready", () => { statusEl.textContent = "live"; statusEl.className = "live"; });
  es.addEventListener("incident", (e) => {
    const payload = JSON.parse(e.data);
    const existing = incidents.get(payload.incidentId) || {};
    incidents.set(payload.incidentId, { ...existing, ...payload.incident, id: payload.incidentId, timeline: existing.timeline });
    renderList();
    if (payload.incidentId === selected) select(selected);
  });
  es.onerror = () => { statusEl.textContent = "reconnecting…"; statusEl.className = ""; };
}

loadAll();
connectStream();
</script>
</body>
</html>
